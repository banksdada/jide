name: Update videos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest videos
        run: python3 tools/update_videos.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Update video list"
            git push
          else
            echo "No changes."
          fi
